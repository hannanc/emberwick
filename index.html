<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberwick</title>
<style>
  :root { --bg:#14171c; --panel:#1c2027; --line:#2c323c; --ink:#e8e4da; --dim:#8f96a3; --gold:#e3b95a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, sans-serif; }
  #app { display:flex; height:100%; }
  #stage { flex:1; min-width:0; display:flex; align-items:center; justify-content:center; padding:12px; }
  canvas { max-width:100%; max-height:100%; border-radius:10px; background:#5d8a4a; cursor:pointer; }
  #side { width:400px; flex:none; display:flex; flex-direction:column; background:var(--panel); border-left:1px solid var(--line); }
  header { padding:14px 16px 10px; border-bottom:1px solid var(--line); }
  h1 { margin:0; font:600 24px Georgia, serif; color:var(--gold); letter-spacing:.5px; }
  #clock { color:var(--ink); margin-top:2px; }
  #status { color:var(--dim); font-size:12px; margin-top:2px; }
  #status::before { content:"●"; margin-right:5px; color:#6c6; }
  #status.off::before { color:#d96; }
  #news { margin-top:8px; padding:8px 10px; background:#262019; border-left:3px solid var(--gold); border-radius:4px; font:italic 13px Georgia, serif; }
  nav { display:flex; border-bottom:1px solid var(--line); }
  nav button { flex:1; padding:9px; background:none; border:0; border-bottom:2px solid transparent; color:var(--dim); font:inherit; cursor:pointer; }
  nav button.on { color:var(--ink); border-bottom-color:var(--gold); }
  .tab { flex:1; overflow-y:auto; padding:10px 14px; display:none; }
  .tab.on { display:block; }
  .ev { padding:7px 0; border-bottom:1px solid #242932; }
  .ev .t { color:var(--dim); font-size:11px; }
  .ev .who { font-weight:600; }
  .ev .say { margin:2px 0 0 10px; padding-left:8px; border-left:2px solid var(--line); font-family:Georgia, serif; }
  .ev .th { color:var(--dim); font-style:italic; font-size:12px; margin-left:10px; }
  .ev .did { color:var(--gold); font-size:12.5px; margin-left:10px; }
  .bar { height:6px; background:#12151a; border-radius:3px; margin-top:6px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--gold); }
  #note { padding:0 14px 6px; color:var(--gold); font-size:12px; min-height:0; }
  .ev.sys { color:var(--gold); font:italic 13px Georgia, serif; }
  .card { padding:10px 12px; margin-bottom:10px; background:#222730; border-radius:8px; border-left:4px solid; }
  .card.sel { outline:1px solid var(--gold); }
  .card h3 { margin:0; font-size:15px; }
  .card .sub { color:var(--dim); font-size:12px; }
  .card p { margin:6px 0 0; }
  .card .th { font-style:italic; color:#c9c4b6; }
  .card small { color:var(--dim); display:block; margin-top:6px; }
  .card ol { margin:6px 0 0; padding-left:20px; }
  .card .q { font-style:italic; color:#c9c4b6; }
  .card .sp { font:15px/1.5 Georgia, serif; color:#cdb7f0; }
  .chr { margin-bottom:22px; font:15px/1.6 Georgia, serif; }
  .chr h3 { margin:0 0 4px; color:var(--gold); font:600 17px Georgia, serif; }
  .chr .w { color:var(--dim); font:12px system-ui; margin-bottom:6px; }
  .chr p { margin:0 0 8px; white-space:pre-wrap; }
  .empty { color:var(--dim); font-style:italic; padding:20px 0; }
  form { display:flex; flex-wrap:wrap; gap:6px; padding:10px 12px; border-top:1px solid var(--line); }
  form select { flex:1 0 100%; }
  select, input, form button { background:#12151a; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:7px 8px; font:inherit; min-width:0; }
  input { flex:1; }
  form button { background:var(--gold); color:#1a1408; border:0; font-weight:600; cursor:pointer; }
  @media (max-width: 900px) { #app { flex-direction:column; } #stage { flex:none; padding:6px; } #side { width:auto; flex:1; min-height:0; border-left:0; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="c" width="1280" height="768"></canvas></div>
  <div id="side">
    <header>
      <h1>Emberwick</h1>
      <div id="clock">…</div>
      <div id="status">connecting</div>
      <div id="news"></div>
    </header>
    <nav>
      <button data-tab="feed" class="on">Live</button>
      <button data-tab="people">Villagers</button>
      <button data-tab="built">Built</button>
      <button data-tab="oracle">Oracle</button>
      <button data-tab="chron">Chronicle</button>
    </nav>
    <div id="feed" class="tab on"></div>
    <div id="people" class="tab"></div>
    <div id="built" class="tab"></div>
    <div id="oracle" class="tab"></div>
    <div id="chron" class="tab"></div>
    <div id="note"></div>
    <form id="whisper">
      <select id="to"><option value="">The whole village hears…</option></select>
      <input id="msg" maxlength="200" placeholder="Whisper a thought or start a rumour" autocomplete="off">
      <button>Send</button>
    </form>
  </div>
</div>
<script>
const T = 32, W = 40, H = 24, SQ = [20, 13.4];
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let st = null, lastEv = 0, selected = null, skew = 0;
const pos = {};                 // name -> {x, y, route:[[x,y]...], place}
const STAND = { Oracle: 1.7, Dock: 1.2, Square: 1.4, Garden: 1.7, Shrine: 1.6, Cottages: 1.9 };
const windows = [];             // lit at night

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const hhmm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');

// ---------------------------------------------------------------- static scenery
let scenery = null;
function door(p) { const [x, y] = st.places[p]; return [x, y + (STAND[p] || 1.9) - 0.5]; }
function distSeg(px, py, a, b) { const dx = b[0] - a[0], dy = b[1] - a[1]; let t = ((px - a[0]) * dx + (py - a[1]) * dy) / (dx * dx + dy * dy); t = Math.max(0, Math.min(1, t)); return Math.hypot(px - a[0] - t * dx, py - a[1] - t * dy); }
function inLake(x, y) { return ((x - 20) / 15.5) ** 2 + ((y - 25) / 5.4) ** 2 < 1; }

function house(g, x, y, w, h, wall, roof, o = {}) {
  const X = x * T, Y = y * T, w2 = w * T / 2, hh = h * T;
  g.fillStyle = 'rgba(0,0,0,.18)'; g.beginPath(); g.ellipse(X, Y + 4, w2 * 1.1, 9, 0, 0, 7); g.fill();
  g.fillStyle = wall; g.fillRect(X - w2, Y - hh, w2 * 2, hh);
  g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(X - w2, Y - hh, w2 * 2, 6);
  if (o.chimney) { g.fillStyle = '#6b5a50'; g.fillRect(X + w2 * 0.45, Y - hh - T * 1.25, 10, T * 0.9); }
  g.fillStyle = roof; g.beginPath(); g.moveTo(X - w2 - 8, Y - hh); g.lineTo(X, Y - hh - T * (o.pitch || 1.1)); g.lineTo(X + w2 + 8, Y - hh); g.closePath(); g.fill();
  g.fillStyle = '#4a3222'; g.fillRect(X - 7, Y - 22, 14, 22);
  for (const wx of (o.win || [-0.55, 0.55])) { const a = X + wx * w2 - 7, b = Y - hh + 14; g.fillStyle = '#31475c'; g.fillRect(a, b, 14, 13); (o.wins || windows).push([a + 7, b + 6]); }
  if (o.sign) { g.fillStyle = o.sign; g.fillRect(X + w2 + 2, Y - hh + 8, 12, 12); }
}
function tree(g, x, y, s, r) {
  const X = x * T, Y = y * T;
  g.fillStyle = 'rgba(0,0,0,.2)'; g.beginPath(); g.ellipse(X, Y + 2, 13 * s, 5 * s, 0, 0, 7); g.fill();
  g.fillStyle = '#5a4030'; g.fillRect(X - 3 * s, Y - 14 * s, 6 * s, 16 * s);
  for (const [dx, dy, rr, c] of [[0, -26, 16, '#2f6b3a'], [-8, -20, 11, '#2a6034'], [8, -21, 11, '#377a43'], [2, -32, 10, '#3f8a4c']]) {
    g.fillStyle = c; g.beginPath(); g.arc(X + dx * s, Y + dy * s, rr * s, 0, 7); g.fill();
  }
}
function buildScenery() {
  const s = document.createElement('canvas'); s.width = cv.width; s.height = cv.height;
  const g = s.getContext('2d'), r = rng(7);
  windows.length = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {       // grass
    const v = r(); g.fillStyle = `hsl(${98 + v * 14}, ${34 + v * 8}%, ${38 + v * 7}%)`; g.fillRect(x * T, y * T, T, T);
  }
  for (let i = 0; i < 500; i++) { g.fillStyle = r() < .5 ? 'rgba(255,255,255,.07)' : 'rgba(0,0,0,.06)'; g.fillRect(r() * cv.width, r() * cv.height, 3, 3); }
  g.fillStyle = '#c9b98a'; g.beginPath(); g.ellipse(20 * T, 25 * T, 15.9 * T, 5.8 * T, 0, 0, 7); g.fill();   // shore
  g.fillStyle = '#3d7fa6'; g.beginPath(); g.ellipse(20 * T, 25 * T, 15.5 * T, 5.4 * T, 0, 0, 7); g.fill();   // lake
  g.fillStyle = '#356f93'; g.beginPath(); g.ellipse(20 * T, 25.6 * T, 12 * T, 3.6 * T, 0, 0, 7); g.fill();
  const paths = Object.keys(st.places).filter(p => p !== 'Square').map(p => [SQ, door(p)]);
  g.lineCap = 'round';
  for (const [w, c] of [[22, '#a8946a'], [16, '#c7b488']]) { g.strokeStyle = c; g.lineWidth = w; for (const [a, b] of paths) { g.beginPath(); g.moveTo(a[0] * T, a[1] * T); g.lineTo(b[0] * T, b[1] * T); g.stroke(); } }
  g.fillStyle = '#c7b488'; g.beginPath(); g.ellipse(20 * T, 12.6 * T, 3.2 * T, 2.2 * T, 0, 0, 7); g.fill();  // square
  const items = [];
  for (let i = 0; i < 400 && items.length < 85; i++) {                                                    // trees
    const x = 0.6 + r() * (W - 1.2), y = 1.4 + r() * (H - 2.4);
    if (inLake(x, y + 0.6) || paths.some(([a, b]) => distSeg(x, y, a, b) < 1.5)) continue;
    if (Object.values(st.places).some(([px, py]) => Math.abs(x - px) < 3.4 && Math.abs(y - py) < 3.2)) continue;
    items.push([y, () => tree(g, x, y, 0.8 + r() * 0.5)]);
  }
  for (let i = 0; i < 70; i++) { const x = r() * W, y = r() * H; if (!inLake(x, y)) { g.fillStyle = ['#f4e36b', '#f0f0f0', '#e98bb0'][i % 3]; g.fillRect(x * T, y * T, 3, 3); } }
  const P = st.places;
  items.push([P.Bakery[1], () => house(g, P.Bakery[0], P.Bakery[1], 3.4, 1.7, '#ead9b4', '#b5432e', { chimney: 1, sign: '#e0a23a' })]);
  items.push([P.Tavern[1], () => house(g, P.Tavern[0], P.Tavern[1], 4.4, 1.9, '#8a6a4a', '#3f6b46', { win: [-0.7, -0.35, 0.35, 0.7], sign: '#d8b13c', chimney: 1 })]);
  items.push([P.Library[1], () => house(g, P.Library[0], P.Library[1], 3.2, 2.3, '#9aa3ad', '#4a5670', { pitch: 1.5 })]);
  items.push([P.Workshop[1], () => { house(g, P.Workshop[0], P.Workshop[1], 3.8, 1.6, '#9c7648', '#6a4a2e'); g.fillStyle = '#b08a5a'; for (let i = 0; i < 4; i++) g.fillRect((P.Workshop[0] + 2.3) * T, (P.Workshop[1] - 0.2 - i * 0.22) * T, 34, 6); }]);
  for (const [dx, dy, c] of [[-1.2, -1.6, '#b0503a'], [0.9, 0, '#a2603a'], [-1.3, 1.9, '#8f4a3a']])
    items.push([P.Cottages[1] + dy, () => house(g, P.Cottages[0] + dx, P.Cottages[1] + dy, 2.2, 1.2, '#e2d2b0', c, { win: [0.55], pitch: 0.9 })]);
  items.push([P.Shrine[1], () => { tree(g, P.Shrine[0], P.Shrine[1], 2.4); g.fillStyle = '#a9aaa6'; g.fillRect((P.Shrine[0] - 1.6) * T, (P.Shrine[1] - 0.2) * T, 16, 24); g.fillStyle = '#e3b95a'; g.fillRect((P.Shrine[0] - 1.6) * T + 5, (P.Shrine[1] - 0.2) * T + 6, 6, 6); }]);
  const [fx, fy] = P.Woods;                                                                               // woods
  for (let i = 0; i < 13; i++) { const x = fx + (r() - .5) * 7.5, y = fy - 1.6 + r() * 2.6, k = 0.9 + r() * 0.6; items.push([y, () => tree(g, x, y, k)]); }
  items.push([fy + 1.2, () => { for (const [a, b] of [[-1.6, 1.1], [1.4, 1.3], [0.2, 0.9]]) { g.fillStyle = '#7a5a3a'; g.beginPath(); g.ellipse((fx + a) * T, (fy + b) * T, 8, 5, 0, 0, 7); g.fill(); g.fillStyle = '#c9a56a'; g.beginPath(); g.ellipse((fx + a) * T, (fy + b) * T - 2, 7, 4, 0, 0, 7); g.fill(); } }]);
  const [ox, oy] = P.Oracle;                                                                              // oracle stones
  items.push([oy + 0.9, () => {
    g.fillStyle = 'rgba(60,50,90,.35)'; g.beginPath(); g.ellipse(ox * T, (oy + 0.3) * T, 2.3 * T, 1.15 * T, 0, 0, 7); g.fill();
    for (let i = 0; i < 7; i++) { const a = Math.PI * (0.05 + i * 0.15) + Math.PI, sx = ox * T + Math.cos(a) * 2 * T, sy = (oy + 0.3) * T + Math.sin(a) * 1 * T, h = 30 + (i % 3) * 9;
      g.fillStyle = 'rgba(0,0,0,.22)'; g.beginPath(); g.ellipse(sx, sy + 2, 9, 4, 0, 0, 7); g.fill();
      g.fillStyle = '#8b8f99'; g.beginPath(); g.roundRect(sx - 7, sy - h, 14, h, 5); g.fill(); g.fillStyle = '#6d717b'; g.fillRect(sx - 7, sy - h + 4, 4, h - 6); }
    g.fillStyle = '#5d6069'; g.beginPath(); g.ellipse(ox * T, (oy + 0.35) * T, 15, 8, 0, 0, 7); g.fill();
  }]);
  const [qx, qy] = P.Quarry;                                                                              // quarry
  items.push([qy + 0.8, () => {
    g.fillStyle = '#6f7378'; g.beginPath(); g.moveTo((qx - 2.3) * T, (qy + 0.8) * T); g.lineTo((qx - 1.9) * T, (qy - 1.2) * T); g.lineTo((qx - 0.4) * T, (qy - 2) * T); g.lineTo((qx + 1.2) * T, (qy - 1.5) * T); g.lineTo((qx + 2.2) * T, (qy + 0.8) * T); g.closePath(); g.fill();
    g.fillStyle = '#8e9297'; g.beginPath(); g.moveTo((qx - 1.5) * T, (qy + 0.8) * T); g.lineTo((qx - 1.2) * T, (qy - 0.7) * T); g.lineTo((qx + 0.3) * T, (qy - 1.3) * T); g.lineTo((qx + 1.3) * T, (qy + 0.8) * T); g.closePath(); g.fill();
    g.fillStyle = '#55595e'; g.fillRect((qx - 0.5) * T, (qy - 0.1) * T, 30, 29);
    for (const [a, b, w] of [[-2.2, 1.1, 16], [1.6, 1.2, 20], [0.9, 1.5, 12]]) { g.fillStyle = '#a3a7ab'; g.fillRect((qx + a) * T, (qy + b) * T, w, w * 0.7); }
  }]);
  items.sort((a, b) => a[0] - b[0]).forEach(i => i[1]());
  const [gx, gy] = P.Garden;                                                                              // garden
  g.strokeStyle = '#7a5a3a'; g.lineWidth = 3; g.strokeRect((gx - 2.6) * T, (gy - 1.9) * T, 5.2 * T, 2.9 * T);
  for (let i = 0; i < 4; i++) { g.fillStyle = '#6b4a30'; g.fillRect((gx - 2.3) * T, (gy - 1.6 + i * 0.65) * T, 4.6 * T, 9); for (let j = 0; j < 12; j++) { g.fillStyle = ['#6fbf5a', '#b06fd0', '#f0d24a', '#e86a6a'][(i + j) % 4]; g.beginPath(); g.arc((gx - 2.1 + j * 0.38) * T, (gy - 1.52 + i * 0.65) * T, 4, 0, 7); g.fill(); } }
  const [wx, wy] = P.Square;                                                                              // well
  g.fillStyle = 'rgba(0,0,0,.2)'; g.beginPath(); g.ellipse(wx * T, (wy + 0.35) * T, 26, 9, 0, 0, 7); g.fill();
  g.fillStyle = '#8d8f8c'; g.beginPath(); g.ellipse(wx * T, wy * T, 20, 12, 0, 0, 7); g.fill();
  g.fillStyle = '#1e2a33'; g.beginPath(); g.ellipse(wx * T, wy * T, 13, 7, 0, 0, 7); g.fill();
  g.fillStyle = '#5a4030'; g.fillRect(wx * T - 20, wy * T - 34, 4, 34); g.fillRect(wx * T + 16, wy * T - 34, 4, 34);
  g.fillStyle = '#8a3f2e'; g.beginPath(); g.moveTo(wx * T - 28, wy * T - 32); g.lineTo(wx * T, wy * T - 50); g.lineTo(wx * T + 28, wy * T - 32); g.fill();
  const [dx, dy] = P.Dock;                                                                                // dock + boat
  g.fillStyle = '#8a6a44'; g.fillRect((dx - 1.7) * T, (dy + 0.5) * T, 3.4 * T, 2.6 * T);
  g.strokeStyle = '#6a4e30'; g.lineWidth = 2; for (let i = 0; i < 9; i++) { g.beginPath(); g.moveTo((dx - 1.7) * T, (dy + 0.5 + i * 0.3) * T); g.lineTo((dx + 1.7) * T, (dy + 0.5 + i * 0.3) * T); g.stroke(); }
  g.fillStyle = '#6b4a30'; g.beginPath(); g.ellipse((dx + 3.2) * T, (dy + 2.5) * T, 34, 11, -0.15, 0, 7); g.fill();
  g.fillStyle = '#c9a56a'; g.beginPath(); g.ellipse((dx + 3.2) * T, (dy + 2.45) * T, 26, 7, -0.15, 0, 7); g.fill();
  scenery = s;
}

// ---------------------------------------------------------------- drawing
function label(text, x, y, color = '#fff', size = 13, bold = true) {
  ctx.font = `${bold ? '600 ' : ''}${size}px system-ui, sans-serif`; ctx.textAlign = 'center';
  ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(15,18,22,.8)'; ctx.strokeText(text, x, y); ctx.fillStyle = color; ctx.fillText(text, x, y);
}
function bubble(text, x, y, color) {
  ctx.font = '15px Georgia, serif'; const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) { if (ctx.measureText(cur + ' ' + w).width > 250 && cur) { lines.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w; }
  lines.push(cur); if (lines.length > 4) { lines.length = 4; lines[3] = lines[3].replace(/.{0,3}$/, '…'); }
  const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + 20, h = lines.length * 19 + 12;
  let bx = Math.max(6, Math.min(cv.width - w - 6, x - w / 2)), by = Math.max(6, y - h - 12);
  ctx.fillStyle = 'rgba(252,249,240,.96)'; ctx.strokeStyle = color; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(bx, by, w, h, 9); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 6, by + h - 1); ctx.lineTo(x, by + h + 9); ctx.lineTo(x + 6, by + h - 1); ctx.fill();
  ctx.fillStyle = '#231d14'; ctx.textAlign = 'left'; lines.forEach((l, i) => ctx.fillText(l, bx + 10, by + 22 + i * 19));
}
function person(a, p, t, walking) {
  const x = p.x * T, y = p.y * T - (walking ? Math.abs(Math.sin(t / 110)) * 4 : 0);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(p.x * T, p.y * T + 1, 10, 4, 0, 0, 7); ctx.fill();
  if (selected === a.name) { ctx.strokeStyle = '#e3b95a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(p.x * T, p.y * T + 1, 15, 7, 0, 0, 7); ctx.stroke(); }
  ctx.fillStyle = a.color; ctx.beginPath(); ctx.roundRect(x - 8, y - 20, 16, 20, 5); ctx.fill();
  ctx.fillStyle = '#f0c9a0'; ctx.beginPath(); ctx.arc(x, y - 26, 7.5, 0, 7); ctx.fill();
  ctx.fillStyle = a.hair; ctx.beginPath(); ctx.arc(x, y - 28, 7.8, Math.PI, 0); ctx.fill();
}
function drawStruct(s, t, wins) {
  const X = s.x * T, Y = s.y * T, c = colorOf(s.owner), g = ctx;
  if (!s.done) {                                             // building site
    const w = s.type === 'beehive' || s.type === 'statue' ? 26 : 46, h = 30 + 50 * s.progress;
    g.fillStyle = 'rgba(120,95,60,.55)'; g.beginPath(); g.ellipse(X, Y, w, 10, 0, 0, 7); g.fill();
    g.strokeStyle = '#c9a56a'; g.lineWidth = 3;
    for (const dx of [-w + 6, w - 6]) { g.beginPath(); g.moveTo(X + dx, Y); g.lineTo(X + dx, Y - h); g.stroke(); }
    for (let yy = 14; yy < h; yy += 16) { g.beginPath(); g.moveTo(X - w + 6, Y - yy); g.lineTo(X + w - 6, Y - yy - 8); g.stroke(); }
    g.fillStyle = '#12151a'; g.fillRect(X - 24, Y + 8, 48, 6); g.fillStyle = '#e3b95a'; g.fillRect(X - 24, Y + 8, 48 * s.progress, 6);
    label(`${s.owner}'s ${s.type} ${Math.round(s.progress * 100)}%`, X, Y + 28, '#f3ead2', 11, false);
    return;
  }
