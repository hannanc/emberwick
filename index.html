<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121418">
<title>Emberwick</title>
<style>
  :root {
    --bg:#121418; --panel:#181b21; --panel2:#20242c; --panel3:#15181d; --line:#2a2f39; --line2:#23272f;
    --ink:#ece7dc; --ink2:#cbc5b8; --dim:#939aa7; --gold:#e8bd5f; --gold-ink:#1b1508; --violet:#b9a2f5;
    --ok:#7bd88f; --warn:#e7a46a;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.5 var(--sans); -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  #app { display:flex; height:100%; height:100dvh; }

  /* ---------------- map */
  #stage { position:relative; flex:1; min-width:0; overflow:hidden; background:#1b2a1b; }
  #c { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; outline:none; }
  #c.drag { cursor:grabbing; } #c.hot { cursor:pointer; }
  #c:focus-visible { box-shadow:inset 0 0 0 2px var(--gold); }
  .glass { background:rgba(16,18,22,.78); border:1px solid rgba(255,255,255,.1); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  .ctl { position:absolute; right:12px; bottom:12px; display:flex; flex-direction:column; gap:6px; }
  .ctl button { width:38px; height:38px; border-radius:10px; font:600 18px/1 var(--sans); cursor:pointer; display:grid; place-items:center; }
  .ctl button:hover { background:rgba(42,46,56,.92); }
  .ctl svg { width:18px; height:18px; }
  #hint { position:absolute; left:12px; bottom:12px; padding:6px 11px; border-radius:999px; font-size:12px; color:var(--ink2); pointer-events:none; transition:opacity .8s; }
  #hint.gone { opacity:0; }
  #focus { position:absolute; left:12px; top:12px; display:none; align-items:center; gap:8px; padding:5px 6px 5px 12px; border-radius:999px; font-size:13px; }
  #focus.on { display:flex; }
  #focus i { width:10px; height:10px; border-radius:50%; }
  #focus button { border:0; background:rgba(255,255,255,.08); border-radius:999px; padding:3px 10px; cursor:pointer; font-size:12px; }
  #focus button:hover { background:rgba(255,255,255,.16); }
  #focus button[aria-pressed=true] { background:var(--gold); color:var(--gold-ink); }
  #banner { position:absolute; top:14px; left:50%; transform:translate(-50%,-8px); max-width:min(720px,calc(100% - 32px)); padding:10px 20px;
    border-radius:12px; background:rgba(16,18,22,.9); border:1px solid var(--gold); color:var(--gold); font:italic 18px/1.4 var(--serif);
    text-align:center; opacity:0; pointer-events:none; transition:opacity .6s, transform .6s; }
  #banner.on { opacity:1; transform:translate(-50%,0); }
  #banner small { display:block; font:600 10.5px var(--sans); letter-spacing:.1em; text-transform:uppercase; font-style:normal; opacity:.8; }
  #loading { position:absolute; inset:0; display:grid; place-items:center; color:var(--ink2); font:italic 17px var(--serif); background:#151b15; transition:opacity .6s; }
  #loading.gone { opacity:0; pointer-events:none; }

  /* ---------------- side panel */
  #side { width:400px; flex:none; display:flex; flex-direction:column; background:var(--panel); border-left:1px solid var(--line); min-height:0; }
  header { padding:16px 18px 12px; border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  h1 { margin:0; font:600 26px/1.1 var(--serif); color:var(--gold); letter-spacing:.3px; }
  #status { font-size:12px; color:var(--dim); display:flex; align-items:center; gap:7px; white-space:nowrap; }
  #status i { width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 3px rgba(123,216,143,.16); }
  #status.off i { background:var(--warn); box-shadow:0 0 0 3px rgba(231,164,106,.16); }
  #clock { margin-top:7px; display:flex; align-items:center; gap:8px; color:var(--ink2); }
  #clock .ic { font-size:16px; width:20px; text-align:center; }
  #clock b { color:var(--ink); font-weight:600; }
  #news { margin-top:10px; padding:8px 12px; background:#241e15; border-left:3px solid var(--gold); border-radius:6px; font:italic 14px/1.45 var(--serif); color:#eadfc6; cursor:default; }
  #news::before { content:"Village news"; display:block; font:600 10.5px var(--sans); letter-spacing:.09em; text-transform:uppercase; color:var(--gold); font-style:normal; margin-bottom:2px; }
  nav { display:flex; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; }
  nav::-webkit-scrollbar { display:none; }
  nav button { flex:1 0 auto; padding:11px 12px 10px; background:none; border:0; border-bottom:2px solid transparent; color:var(--dim); font-weight:500; font-size:13.5px; cursor:pointer; white-space:nowrap; }
  nav button:hover { color:var(--ink); }
  nav button[aria-selected=true] { color:var(--ink); border-bottom-color:var(--gold); }
  nav .n { margin-left:6px; font-size:11px; padding:1px 6px; border-radius:9px; background:var(--panel2); color:var(--dim); }
  nav .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-left:6px; background:var(--violet); box-shadow:0 0 8px var(--violet); vertical-align:1px; }
  .tab { flex:1; overflow-y:auto; padding:0 14px 16px; display:none; min-height:0; position:relative; scrollbar-width:thin; scrollbar-color:#343a46 transparent; }
  .tab.on { display:block; }
  .tab > :first-child { margin-top:12px; }
  .empty { color:var(--dim); font-style:italic; padding:18px 2px; }
  .sec { font:600 11px var(--sans); letter-spacing:.09em; text-transform:uppercase; color:var(--dim); margin:16px 0 8px; }

  /* feed */
  .chips { position:sticky; top:0; z-index:2; display:flex; gap:6px; flex-wrap:wrap; padding:12px 0 10px; margin:0 !important; background:var(--panel); }
  .chip { padding:4px 11px; border-radius:999px; border:1px solid var(--line); background:none; color:var(--dim); font-size:12.5px; font-weight:500; cursor:pointer; }
  .chip:hover { color:var(--ink); border-color:#3a404c; }
  .chip.on { background:var(--gold); border-color:var(--gold); color:var(--gold-ink); }
  #newpill { position:sticky; top:52px; z-index:3; display:none; margin:0 auto -30px; width:max-content; padding:5px 12px; border-radius:999px; border:0;
    background:var(--gold); color:var(--gold-ink); font-size:12px; font-weight:600; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.4); }
  #newpill.on { display:block; }
  .dayrule { display:flex; align-items:center; gap:10px; color:var(--dim); font:600 11px var(--sans); letter-spacing:.09em; text-transform:uppercase; margin:12px 0 2px; }
  .dayrule::after { content:""; flex:1; height:1px; background:var(--line); }
  .ev { display:grid; grid-template-columns:30px 1fr; gap:10px; padding:11px 0; border-bottom:1px solid var(--line2); }
  .av { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font:700 13px var(--sans); color:#16120b; border:0; padding:0; cursor:pointer; box-shadow:inset 0 -3px 0 rgba(0,0,0,.18); }
  .ev .hd { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .who { font-weight:650; cursor:pointer; background:none; border:0; padding:0; }
  .who:hover { text-decoration:underline; }
  .act { color:var(--ink2); }
  .meta { color:var(--dim); font-size:11.5px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .deep { color:var(--violet); font-size:11.5px; margin-left:6px; white-space:nowrap; }
  .say { margin-top:7px; padding:8px 12px; background:var(--panel2); border-radius:3px 12px 12px 12px; font:15px/1.5 var(--serif); color:var(--ink); }
  .say .to { display:block; font:600 10.5px var(--sans); color:var(--dim); letter-spacing:.07em; text-transform:uppercase; margin-bottom:2px; }
  .did { margin-top:7px; display:inline-block; padding:3px 10px; border-radius:999px; background:rgba(232,189,95,.12); color:var(--gold); font-size:12.5px; }
  .th { margin-top:7px; color:#b8b2a4; font:italic 13.5px/1.5 var(--serif); }
  .th::before { content:"thinks · "; font:500 11px var(--sans); font-style:normal; color:var(--dim); letter-spacing:.03em; }
  .walk { margin-top:5px; color:var(--dim); font-size:12px; }
  .ev.sys .av { background:#2a2440; color:var(--violet); box-shadow:none; cursor:default; }
  .ev.sys.you .av { background:#3a3020; color:var(--gold); }
  .ev.sys .body { margin-top:3px; font:italic 14.5px/1.5 var(--serif); color:#e7dcc2; }
  .ev.sys.or .body { color:#ddd0ff; }
  .ev.sys .lbl { font-weight:600; color:var(--ink); }
  .ev.sys.pr .av { background:#1c3430; color:#8fe3c8; }
  .ev.sys.pr .body { color:#d4efe6; }
  .card .bl { font:italic 15px/1.55 var(--serif); color:#cfeee2; }
  .card .why { color:var(--dim); font-size:12.5px; }
  .gift span { background:rgba(143,227,200,.12) !important; color:#9fe9d0 !important; }

  /* cards */
  .card { padding:12px 14px; margin-bottom:10px; background:var(--panel2); border-radius:10px; border:1px solid transparent; border-left:4px solid; }
  .card.sel { border-color:rgba(232,189,95,.55); border-left-color:inherit; box-shadow:0 0 0 1px rgba(232,189,95,.25); }
  .card .top { display:flex; gap:11px; align-items:center; }
  .card .av { width:36px; height:36px; font-size:15px; flex:none; }
  .card h3 { margin:0; font-size:15.5px; line-height:1.25; }
  .card .sub { color:var(--dim); font-size:12.5px; }
  .card p { margin:8px 0 0; }
  .card .q { font:italic 14.5px/1.5 var(--serif); color:#c9c4b6; }
  .card .sp { font:15.5px/1.55 var(--serif); color:#d9c9ff; }
  .mood { margin-left:auto; align-self:flex-start; font-size:11.5px; padding:2px 9px; border-radius:999px; background:rgba(255,255,255,.06); color:var(--ink2); white-space:nowrap; max-width:42%; overflow:hidden; text-overflow:ellipsis; }
  .inv { display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; }
  .inv span { font-size:12px; padding:2px 8px; border-radius:6px; background:var(--panel3); color:var(--ink2); }
  .inv .own { color:var(--gold); }
  .card ol { margin:6px 0 0; padding-left:20px; }
  .card li { margin:2px 0; }
  details { margin-top:9px; }
  summary { cursor:pointer; color:var(--dim); font-size:12.5px; list-style:none; }
  summary::-webkit-details-marker { display:none; }
  summary::before { content:"▸ "; } details[open] summary::before { content:"▾ "; }
  details .kv { margin-top:6px; font-size:13px; color:var(--ink2); }
  details .kv b { color:var(--dim); font-weight:500; }
  .acts { display:flex; gap:6px; margin-top:11px; }
  .btn { padding:5px 11px; border-radius:7px; border:1px solid var(--line); background:var(--panel3); font-size:12.5px; cursor:pointer; color:var(--ink2); }
  .btn:hover { color:var(--ink); border-color:#3d4450; }
  .bar { height:7px; background:#12151a; border-radius:4px; margin-top:9px; overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:4px; background:linear-gradient(90deg,#c08c35,var(--gold)); }
  .pill { display:inline-block; font-size:11.5px; font-weight:600; padding:2px 9px; border-radius:999px; }
  .pill.ready { background:rgba(185,162,245,.18); color:var(--violet); }
  .pill.resting { background:rgba(255,255,255,.07); color:var(--ink2); }
  .pill.asleep { background:rgba(231,164,106,.14); color:var(--warn); }
  .chr { margin:4px 0 26px; max-width:62ch; }
  .chr h3 { margin:0 0 2px; color:var(--gold); font:600 18px/1.3 var(--serif); }
  .chr .w { color:var(--dim); font-size:12px; margin-bottom:8px; }
  .chr p { margin:0 0 10px; font:15.5px/1.68 var(--serif); color:#e3ddcf; white-space:pre-wrap; }

  /* whisper */
  #note { padding:0 14px; color:var(--gold); font-size:12.5px; }
  #note:not(:empty) { padding:6px 14px 0; }
  form { display:grid; grid-template-columns:1fr auto; gap:7px; padding:10px 12px 12px; border-top:1px solid var(--line); }
  form select { grid-column:1 / -1; }
  select, input, form button { background:var(--panel3); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; min-width:0; }
  select:hover, input:hover { border-color:#3a404c; }
  input:focus, select:focus { border-color:var(--gold); outline:none; }
  form button { background:var(--gold); color:var(--gold-ink); border:0; font-weight:650; padding:8px 16px; cursor:pointer; }
  form button:hover { filter:brightness(1.07); }

  @media (max-width:1100px) { #side { width:350px; } nav button { padding:11px 8px 10px; font-size:13px; } }
  @media (max-width:900px) {
    #app { flex-direction:column; }
    #stage { flex:none; height:46vh; height:46dvh; min-height:250px; }
    #side { width:auto; flex:1; border-left:0; border-top:1px solid var(--line); }
    header { padding:10px 14px 8px; }
    h1 { font-size:21px; }
    #news { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; max-height:calc(2.9em + 12px); cursor:pointer; padding:6px 10px; font-size:13.5px; }
    #news::before { display:none; }
    #news.open { display:block; max-height:none; }
    #hint { display:none; }
    .ctl button { width:34px; height:34px; }
    #banner { font-size:15px; padding:8px 14px; }
  }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c" tabindex="0" aria-label="Map of Emberwick. Drag to pan, scroll or pinch to zoom, click a villager to select them. Keys: plus and minus zoom, 0 resets, arrows pan, Escape deselects."></canvas>
    <div id="loading">Waking the village…</div>
    <div id="banner" role="status"></div>
    <div id="focus" class="glass"><i></i><span></span><button id="follow" aria-pressed="false" title="Keep the map centred on this villager">Follow</button><button id="unsel" aria-label="Deselect">✕</button></div>
    <div id="hint" class="glass">Drag to pan · scroll to zoom · click a villager</div>
    <div class="ctl">
      <button class="glass" id="zin" title="Zoom in (+)" aria-label="Zoom in">+</button>
      <button class="glass" id="zout" title="Zoom out (−)" aria-label="Zoom out">−</button>
      <button class="glass" id="zfit" title="Show the whole village (0)" aria-label="Show the whole village"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg></button>
    </div>
  </div>
  <div id="side">
    <header>
      <div class="brand"><h1>Emberwick</h1><div id="status" class="off"><i></i><span>connecting</span></div></div>
      <div id="clock"><span class="ic">·</span><span>…</span></div>
      <div id="news" hidden></div>
    </header>
    <nav role="tablist" aria-label="Village views">
      <button role="tab" aria-selected="true" aria-controls="feed" data-tab="feed">Live</button>
      <button role="tab" aria-selected="false" aria-controls="people" data-tab="people">Villagers</button>
      <button role="tab" aria-selected="false" aria-controls="built" data-tab="built">Built<span class="n" id="nbuilt" hidden></span></button>
      <button role="tab" aria-selected="false" aria-controls="oracle" data-tab="oracle">Oracle<span class="dot" id="nor" hidden></span></button>
      <button role="tab" aria-selected="false" aria-controls="prayers" data-tab="prayers">Prayers<span class="n" id="npray" hidden></span></button>
      <button role="tab" aria-selected="false" aria-controls="chron" data-tab="chron">Chronicle</button>
    </nav>
    <div id="feed" class="tab on" role="tabpanel">
      <div class="chips" id="chips"></div>
      <button id="newpill">↑ New events</button>
      <div id="feedlist"></div>
    </div>
    <div id="people" class="tab" role="tabpanel"></div>
    <div id="built" class="tab" role="tabpanel"></div>
    <div id="oracle" class="tab" role="tabpanel"></div>
    <div id="prayers" class="tab" role="tabpanel"></div>
    <div id="chron" class="tab" role="tabpanel"></div>
    <div id="note" role="status"></div>
    <form id="whisper">
      <select id="to" aria-label="Who hears it"><option value="">The whole village hears…</option></select>
      <input id="msg" maxlength="200" placeholder="Whisper a thought or start a rumour" autocomplete="off" aria-label="Message">
      <button>Send</button>
    </form>
  </div>
</div>
<script>
// ================================================================ setup
const T = 32, W = 58, H = 24, WW = W * T, WH = H * T, M = 8 * T, SS = 1.5, SQ = [20, 13.4];
const SERIF = getComputedStyle(document.documentElement).getPropertyValue('--serif'), SANS = getComputedStyle(document.documentElement).getPropertyValue('--sans');
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d'), stage = $('stage');
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const STAND = { Oracle: 1.7, Dock: 1.2, Square: 1.4, Garden: 1.7, Shrine: 1.6, Cottages: 1.9, Meadow: 1.9 };
const VIA = { Meadow: 'Shrine' };   // places reached by a branch off another place's path, not straight from the Square
const PLACE_NAME = { Tavern: 'The Gilded Newt', Shrine: 'Old Oak Shrine' };
let st = null, selected = null, hover = null, skew = 0, filter = 'all', scenery = null, pathPts = {};
const pos = {};               // name -> {x, y, route:[[x,y]...], place, walking}
const windows = [];           // static window / lamp lights in world px

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(s) { let h = 7; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 2654435761); return h >>> 0; }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const hhmm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const colorOf = n => (st && st.agents.find(a => a.name === n) || {}).color || '#bbb';
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

// ================================================================ camera
const cam = { x: WW / 2, y: WH / 2, z: 1, tx: WW / 2, ty: WH / 2, tz: 1, follow: false };
let vw = 1, vh = 1, dpr = 1, userMoved = false;
const fitZ = () => Math.min(vw / WW, vh / WH);
const minZ = () => fitZ() * 0.9;
const maxZ = () => Math.max(3, fitZ() * 4);
function defaultZ() { const f = fitZ(); return f < 0.55 ? Math.min(Math.max(vw / WW, vh / WH), 0.62) : f; }
function clampT() {
  cam.tz = clamp(cam.tz, minZ(), maxZ());
  for (const [k, size, v] of [['tx', WW, vw], ['ty', WH, vh]]) {
    const half = v / 2 / cam.tz, lo = -M + half, hi = size + M - half;
    cam[k] = lo > hi ? size / 2 : clamp(cam[k], lo, hi);
  }
}
function resetView(instant) {
  cam.follow = false; userMoved = false; cam.tz = defaultZ(); cam.tx = WW / 2; cam.ty = WH / 2; clampT();
  if (instant) { cam.x = cam.tx; cam.y = cam.ty; cam.z = cam.tz; }
  syncFocus();
}
function resize() {
  const r = stage.getBoundingClientRect(), first = vw === 1;
  vw = Math.max(1, r.width); vh = Math.max(1, r.height); dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  if (first || !userMoved) resetView(true); else clampT();
}
new ResizeObserver(resize).observe(stage);
const toScreen = (x, y) => [(x - cam.x) * cam.z + vw / 2, (y - cam.y) * cam.z + vh / 2];
const toWorld = (sx, sy) => [(sx - vw / 2) / cam.z + cam.x, (sy - vh / 2) / cam.z + cam.y];
function zoomAt(f, sx = vw / 2, sy = vh / 2, instant) {
  const wx = (sx - vw / 2) / cam.tz + cam.tx, wy = (sy - vh / 2) / cam.tz + cam.ty;
  cam.tz = clamp(cam.tz * f, minZ(), maxZ());
  if (!cam.follow) { cam.tx = wx - (sx - vw / 2) / cam.tz; cam.ty = wy - (sy - vh / 2) / cam.tz; }
  clampT(); userMoved = true; dismissHint();
  if (instant) { cam.x = cam.tx; cam.y = cam.ty; cam.z = cam.tz; }
}

// ================================================================ scenery
function door(p) { const [x, y] = st.places[p]; return [x, y + (STAND[p] || 1.9) - 0.5]; }
function distSeg(px, py, a, b) { const dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy || 1; let t = ((px - a[0]) * dx + (py - a[1]) * dy) / L; t = clamp(t, 0, 1); return Math.hypot(px - a[0] - t * dx, py - a[1] - t * dy); }

  const going = st.structures.filter(s => !s.done).reverse(), done = st.structures.filter(s => s.done).reverse();
  $('nbuilt').hidden = !st.structures.length; $('nbuilt').textContent = st.structures.length;
  if (!st.structures.length) { box.append(el('div', 'empty', 'Nothing has been built yet. Villagers gather wood at the Woods and stone at the Quarry, trade for what they lack, and build houses, stalls, boats, beehives, a mill, statues, sheds and watchtowers.')); return; }
  const card = s => {
    const c = el('div', 'card'); c.style.borderLeftColor = colorOf(s.owner);
    c.append(el('h3', '', `${s.owner}'s ${s.type}`), el('div', 'sub', `at the ${s.site} · ${s.done ? 'finished' : 'started'} on day ${s.day}` + (s.helpers.length ? ` · helped by ${s.helpers.join(', ')}` : '')));
    if (s.done) c.append(el('p', '', cap(s.perk) + '.'));
    else { c.append(el('p', '', `Still needs ${s.needs}.`)); const b = el('div', 'bar'), i = el('i'); i.style.width = Math.round(s.progress * 100) + '%'; b.append(i); c.append(b); b.title = Math.round(s.progress * 100) + '% done'; }
    c.onclick = () => { cam.follow = false; cam.tx = s.x * T; cam.ty = s.y * T - 30; cam.tz = Math.max(cam.tz, defaultZ() * 1.6); clampT(); userMoved = true; syncFocus(); };
    c.style.cursor = 'pointer'; c.title = 'Show on the map'; return c;
  };
  if (going.length) { box.append(el('div', 'sec', `Being built · ${going.length}`)); going.forEach(s => box.append(card(s))); }
  if (done.length) { box.append(el('div', 'sec', `Finished · ${done.length}`)); done.forEach(s => box.append(card(s))); }
}
let oracleKey = null;
function renderOracle() {
  const O = st.oracle; $('nor').hidden = O.state !== 'ready';
  const key = O.state + O.wait + O.log.length + O.model; if (key === oracleKey) return; oracleKey = key;
  const box = $('oracle'); box.replaceChildren();
  const head = el('div', 'card'); head.style.borderLeftColor = '#a98cf0';
  const top = el('div', 'top'), id = el('div'); id.append(el('h3', '', 'The Oracle'), el('div', 'sub', O.state === 'asleep' ? 'No backend available' : 'Last answered by ' + (O.model || '—')));
  top.append(id, el('span', 'pill ' + O.state, O.state === 'ready' ? 'Awake' : O.state === 'resting' ? `Resting · ${O.wait} min` : 'Asleep')); head.append(top);
  head.append(el('p', '', O.state === 'ready' ? 'The first villager to walk to the standing stones and ask will be answered. One petition an hour.'
    : O.state === 'resting' ? `It will answer again in about ${O.wait} minute${O.wait === 1 ? '' : 's'}.`
    : 'It needs an Anthropic or xAI API key, or the local colibri server running, before it can speak (see the README).'));
  box.append(head);
  if (O.log.length) box.append(el('div', 'sec', 'Petitions'));
  for (const c of O.log) {
    const d = el('div', 'card'); d.style.borderLeftColor = colorOf(c.who);
    const top = el('div', 'top'), id = el('div'); id.append(el('h3', '', `${c.who} asked`), el('div', 'sub', `Day ${c.day} · ${hhmm(c.minute)}`)); top.append(avatar(c.who), id); d.append(top);
    d.append(el('p', 'q', '“' + c.question + '”'), el('p', 'sp', '“' + c.speech + '”'));
    c.answer.split(/\n+/).forEach(x => d.append(el('p', '', x)));
    if (c.plan.length) { const ol = el('ol'); c.plan.forEach(x => ol.append(el('li', '', x))); d.append(ol); }
    box.append(d);
  }
}
let prayKey = '';
function renderPrayers() {
  const P = st.prayers || [], Wi = st.wishes || [];
  $('npray').hidden = !P.length; $('npray').textContent = P.length;
  const key = JSON.stringify([P, Wi.map(w => w.at)]); if (key === prayKey) return; prayKey = key;
  const box = $('prayers'); box.replaceChildren();
  const head = el('div', 'card'); head.style.borderLeftColor = '#8fe3c8';
  head.append(el('h3', '', 'The Old Oak Shrine'), el('p', '', 'Each villager may pray once a day. At nightfall the heavens grant one wish to one villager, and only if it is reasonable. A granted wish is capped at 5 goods and 10 coins, and/or the missing materials for one building under way.'));
  box.append(head);
  box.append(el('div', 'sec', st.phase === 'night' ? `Tonight's prayers · ${P.length}` : `Prayers today · ${P.length}`));
  if (!P.length) box.append(el('div', 'empty', 'Nobody has prayed yet today.'));
  for (const p of P.slice().reverse()) {
    const c = el('div', 'card'); c.style.borderLeftColor = colorOf(p.who);
    const top = el('div', 'top'), id = el('div'); id.append(el('h3', '', p.who), el('div', 'sub', `Day ${p.day} · ${hhmm(p.minute)}`)); top.append(avatar(p.who), id);
    c.append(top, el('p', 'q', '“' + p.wish + '”')); box.append(c);
  }
  if (Wi.length) box.append(el('div', 'sec', 'Wishes granted'));
  for (const w of Wi) {
    const c = el('div', 'card'); c.style.borderLeftColor = colorOf(w.who);
    const top = el('div', 'top'), id = el('div'); id.append(el('h3', '', `${w.who}'s wish`), el('div', 'sub', `Night of day ${w.day}`)); top.append(avatar(w.who), id);
    c.append(top, el('p', 'q', '“' + w.wish + '”'), el('p', 'bl', w.blessing));
    if (w.gifts.length) { const g = el('div', 'inv gift'); w.gifts.forEach(x => g.append(el('span', '', x))); c.append(g); }
    if (w.reason) c.append(el('p', 'why', w.reason));
    box.append(c);
  }
}
let chronKey = '';
function renderChron() {
  const key = st.chronicle.map(c => c.day).join(); if (key === chronKey) return; chronKey = key;
  const box = $('chron'); box.replaceChildren();
  if (!st.chronicle.length) box.append(el('div', 'empty', 'The first chronicle is written when night falls on day 1.'));
  for (const c of st.chronicle) { const d = el('article', 'chr'); d.append(el('h3', '', `Day ${c.day} — ${c.title}`), el('div', 'w', cap(c.weather))); c.body.split(/\n+/).forEach(p => d.append(el('p', '', p))); box.append(d); }
}
function weatherIcon(w, m) {
  const night = m < 6 * 60 || m >= 20.5 * 60;
  return /storm/.test(w) ? '⛈' : /rain/.test(w) ? '☂' : /mist|haze/.test(w) ? '≋' : /overcast/.test(w) ? '☁' : /windy/.test(w) ? '༄' : night ? '☾' : '☀';
}
function renderHeader() {
  const c = $('clock'); c.firstChild.textContent = weatherIcon(st.weather, st.minute);
  const span = c.lastChild; span.replaceChildren(el('b', '', `Day ${st.day}`), ` · ${hhmm(st.minute)} · ${cap(st.weather)}`);
  const s = $('status'); s.className = st.status === 'running' ? '' : 'off';
  s.lastChild.textContent = st.status === 'running' ? 'Live' : cap(st.status);
  s.title = `Villagers: ${st.models.actor} · Narrator: ${st.models.narrator}`;
  const n = $('news'); n.hidden = !st.news; if (n.textContent !== st.news) n.textContent = st.news;
  const now = Date.now() / 1000 + skew, v = st.voice, wi = (st.wishes || [])[0], b = $('banner');
  const voiceOn = v && now - v.at < 45, wishOn = !voiceOn && wi && now - wi.at < 90;
  const k = voiceOn ? 'v' + v.at : wishOn ? 'w' + wi.at : '';
  if (k && b.dataset.k !== k) {
    b.dataset.k = k;
    if (voiceOn) b.replaceChildren(el('small', '', 'A voice from the sky'), '“' + v.text + '”');
    else b.replaceChildren(el('small', '', `✦ A wish is granted to ${wi.who}`), wi.blessing);
  }
  b.classList.toggle('on', !!k);
}
$('news').onclick = () => $('news').classList.toggle('open');

async function poll() {
  try {
    const r = await fetch('/api/state'); st = await r.json(); skew = st.now - Date.now() / 1000;
    if (!scenery) { buildPaths(); buildScenery(); $('loading').classList.add('gone'); setTimeout(() => $('loading').remove(), 700); }
    syncPositions();
    if ($('to').options.length === 1) for (const a of st.agents) $('to').add(new Option('Whisper to ' + a.name, a.name));
    renderHeader(); renderFeed(); renderPeople(); renderBuilt(); renderOracle(); renderPrayers(); renderChron(); syncFocus();
  } catch (e) { const s = $('status'); s.className = 'off'; s.lastChild.textContent = 'Connection lost'; }
  setTimeout(poll, 2500);
}
poll();

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.id === b.dataset.tab));
  if (b.dataset.tab === 'people' && selected) { const c = $('card-' + selected); if (c) c.scrollIntoView({ block: 'nearest' }); }
});
$('to').onchange = () => { selected = $('to').value || null; syncFocus(); if (st) { renderPeople(true); renderFeed(true); } };
$('whisper').onsubmit = async ev => {
  ev.preventDefault(); const text = $('msg').value.trim(); if (!text) return;
  const to = $('to').value, note = $('note');
  try {
    const r = await (await fetch('/api/whisper', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ to, text }) })).json();
    note.textContent = r.ok ? (to ? `Sent. ${to} takes the next turn and will react within about 20 seconds.` : 'Sent. Each villager reacts on their next turn, one every 15–20 seconds.') : (r.note || 'That did not go through.');
  } catch (e) { note.textContent = 'Could not reach the server.'; }
  clearTimeout(note.timer); note.timer = setTimeout(() => note.textContent = '', 30000);
  $('msg').value = ''; filter = 'all'; feedKey = ''; document.querySelector('[data-tab=feed]').click();
};
</script>
